        function showNotification(message, type = 'success') {
            state.notification = { message, type };
            render();
            setTimeout(() => {
                state.notification = null;
                render();
            }, 3500);
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (state.notification) {
                const notifEl = document.createElement('div');
                notifEl.className = `fixed top-5 right-5 z-50 px-5 py-3 rounded-xl shadow-lg text-white font-medium flex items-center gap-3 transition-all transform translate-y-0 ${state.notification.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`;

                app.appendChild(notifEl);
            }

            if (!state.user) {
                if (state.view === 'register') {
                    app.appendChild(renderRegister());
                } else {
                    app.appendChild(renderLogin());
                }
            } else {
                app.appendChild(renderMainLayout());
            }

            lucide.createIcons();
        }

        function renderLogin() {
            const container = document.createElement('div');
            container.className = 'min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-red-50 via-slate-50 to-red-100';

                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Nomor Induk Pegawai (NIP)</label>

            container.querySelector('#login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!supabaseClient) {
                    showNotification('Supabase belum dikonfigurasi!', 'error');
                    return;

                const nip = document.getElementById('login-nip').value.trim();
                const password = document.getElementById('login-password').value;

                try {
                    const { data, error } = await supabaseClient
                        .from('pegawai')
                        .select('*')

                        .eq('password', password)

        // --- DASHBOARD VIEW DENGAN FILTER PER BULAN ---
        function renderDashboardView() {
            const userLaporan = state.laporanList.filter(l => l.pegawai_id === state.user.id);
            
            // Filter laporan berdasarkan bulan yang dipilih (Format tanggal di DB: YYYY-MM-DD)
            const filteredLaporan = userLaporan.filter(l => {
                if (!l.tanggal) return false;
                return l.tanggal.startsWith(state.selectedMonth);
            });

            const totalKegiatan = filteredLaporan.length;
            const disetujui = filteredLaporan.filter(l => l.status === 'Disetujui').length;
            const totalFoto = filteredLaporan.reduce((acc, l) => {
                let urls = parseFotoUrls(l.foto_urls);
                return acc + urls.length;
            }, 0);

            const div = document.createElement('div');
            div.className = 'space-y-6';
            div.innerHTML = `
                <!-- Filter Bulan -->
                <div class="glass-card p-4 rounded-2xl shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div>
                        <h3 class="font-bold text-slate-800">Ringkasan Kinerja Bulanan</h3>
                        <p class="text-xs text-slate-500">Pilih bulan untuk melihat rekapitulasi laporan harian.</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="text-xs font-semibold text-slate-600 uppercase">Pilih Bulan:</label>
                        <input type="month" id="filter-bulan" value="${state.selectedMonth}" class="px-3 py-2 rounded-xl border border-slate-200 bg-white text-sm font-medium focus:ring-2 focus:ring-red-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="glass-card p-5 rounded-2xl shadow-sm border-l-4 border-l-red-600">
                        <span class="text-xs text-slate-500 font-semibold uppercase">Total Laporan Bulan Ini</span>
                        <h3 class="text-2xl font-bold text-slate-800 mt-1">${totalKegiatan} Catatan</h3>
                    </div>
                    <div class="glass-card p-5 rounded-2xl shadow-sm border-l-4 border-l-emerald-500">
                        <span class="text-xs text-slate-500 font-semibold uppercase">Status Disetujui</span>
                        <h3 class="text-2xl font-bold text-slate-800 mt-1">${disetujui} Laporan</h3>
                    </div>
                    <div class="glass-card p-5 rounded-2xl shadow-sm border-l-4 border-l-amber-500">
                        <span class="text-xs text-slate-500 font-semibold uppercase">Total Foto Dokumentasi</span>
                        <h3 class="text-2xl font-bold text-slate-800 mt-1">${totalFoto} Foto</h3>
                    </div>
                </div>

                <div class="glass-card p-6 rounded-2xl shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-slate-800">Aktivitas Laporan Bulan ${state.selectedMonth}</h3>
                        <button onclick="state.view='input'; render();" class="px-4 py-2 bg-red-600 text-white rounded-xl text-xs font-semibold shadow-md hover:bg-red-700 transition">
                            + Buat Laporan Baru
                        </button>
                    </div>
                    <div class="divide-y divide-slate-100">
                        ${filteredLaporan.length === 0 ? '<p class="text-sm text-slate-500 py-4 text-center">Belum ada laporan harian pada bulan ini.</p>' : 
                            filteredLaporan.slice(-5).reverse().map(l => `
                                <div class="py-3 flex items-center justify-between">
                                    <div>
                                        <p class="font-semibold text-sm text-slate-800">${l.uraian_kegiatan}</p>
                                        <span class="text-xs text-slate-500">${l.tanggal} • ${l.volume}</span>
                                    </div>
                                    <span class="px-3 py-1 bg-emerald-50 text-emerald-700 rounded-full text-xs font-semibold">${l.status}</span>
                                </div>
                            `).join('')}
                    </div>
                </div>
            `;

            // Event listener untuk ubah bulan
            div.querySelector('#filter-bulan').addEventListener('change', (e) => {
                state.selectedMonth = e.target.value;
                render();
            });

            return div;
        }

                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Tanggal Kegiatan</label>
                            <input type="date" id="lap-tanggal" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white/70">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Volume / Satuan Hasil</label>
                            <input type="text" id="lap-volume" placeholder="Contoh: 1 Dokumen / 50 KPM" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white/70">
                        </div>
                    </div>

                    <!-- Filter / Pilihan RHK -->
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Jenis Rencana Hasil Kerja (RHK)</label>
                        <select id="lap-rhk" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white/70 text-sm">
                            <option value="">-- Pilih Rencana Hasil Kerja --</option>
                            ${REF_RHK_AKSI.map((item, idx) => `<option value="${idx}">${item.rhk}</option>`).join('')}
                        </select>
                    </div>

                    <!-- Filter / Pilihan Rencana Aksi -->
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Pilihan Laporan Harian (Rencana Aksi)</label>
                        <select id="lap-aksi" required disabled class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-100 text-sm">
                            <option value="">-- Pilih RHK terlebih dahulu --</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Uraian Tugas / Catatan Detail Kegiatan</label>
                        <textarea id="lap-uraian" rows="3" placeholder="Rincian kegiatan harian..." required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white/70"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Lokasi Kegiatan</label>
                        <input type="text" id="lap-lokasi" placeholder="Nama instansi / alamat / lokasi kegiatan" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white/70">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Unggah Foto Dokumentasi (Bisa Pilih Banyak)</label>
                        <input type="file" id="lap-foto" accept="image/*" multiple class="w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100">
                    </div>
                    <button type="submit" id="btn-submit-lap" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-xl shadow-lg shadow-red-600/30 transition">
                        Simpan Laporan Harian
                    </button>
                </form>
            `;

            // Dinamis Update Dropdown Rencana Aksi saat RHK dipilih
            const selectRhk = div.querySelector('#lap-rhk');
            const selectAksi = div.querySelector('#lap-aksi');

            selectRhk.addEventListener('change', (e) => {
                const idx = e.target.value;
                selectAksi.innerHTML = '<option value="">-- Pilih Rencana Aksi --</option>';
                if (idx !== "") {
                    selectAksi.disabled = false;
                    selectAksi.className = "w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white/70 text-sm focus:ring-2 focus:ring-red-500";
                    REF_RHK_AKSI[idx].aksi.forEach(act => {
                        const opt = document.createElement('option');
                        opt.value = act;
                        opt.textContent = act;
                        selectAksi.appendChild(opt);
                    });
                } else {
                    selectAksi.disabled = true;
                    selectAksi.className = "w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-100 text-sm";
                }
            });

            div.querySelector('#laporan-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btn-submit-lap');
                btn.disabled = true;
                btn.innerText = 'Menyimpan...';

                const fotoInput = document.getElementById('lap-foto');
                const files = fotoInput.files;
                let fotoUrls = [];

                const rhkIndex = selectRhk.value;
                const rhkText = REF_RHK_AKSI[rhkIndex].rhk;
                const aksiText = selectAksi.value;

                const compressImage = (file) => {
                    return new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            const img = new Image();
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                const MAX_WIDTH = 600;
                                const MAX_HEIGHT = 600;
                                let width = img.width;
                                let height = img.height;

                                if (width > height) {
                                    if (width > MAX_WIDTH) {
                                        height *= MAX_WIDTH / width;
                                        width = MAX_WIDTH;
                                    }
                                } else {
                                    if (height > MAX_HEIGHT) {
                                        width *= MAX_HEIGHT / height;
                                        height = MAX_HEIGHT;
                                    }
                                }

                                canvas.width = width;
                                canvas.height = height;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, width, height);
                                resolve(canvas.toDataURL('image/jpeg', 0.6));
                            };
                            img.src = event.target.result;
                        };
                        reader.readAsDataURL(file);
                    });
                };

                for (let i = 0; i < files.length; i++) {
                    const compressed = await compressImage(files[i]);
                    fotoUrls.push(compressed);
                }

                await saveLaporanToSupabase(JSON.stringify(fotoUrls), rhkText, aksiText);
                btn.disabled = false;
                btn.innerText = 'Simpan Laporan Harian';
            });

            return div;
        }

        async function saveLaporanToSupabase(fotoUrlsJson, rhkText, aksiText) {
            try {
                if (!supabaseClient) {
                    showNotification('Supabase belum terhubung!', 'error');
                    return;
                }

                const newLap = {
                    pegawai_id: state.user.id,
                    tanggal: document.getElementById('lap-tanggal').value,
                    rhk: rhkText,
                    rencana_aksi: aksiText,
                    uraian_kegiatan: document.getElementById('lap-uraian').value,
                    volume: document.getElementById('lap-volume').value,
                    lokasi: document.getElementById('lap-lokasi').value,
                    foto_urls: fotoUrlsJson,
                    status: 'Pending'
                };

                const { error } = await supabaseClient.from('laporan_harian').insert([newLap]);
                if (error) throw error;

                showNotification('Laporan harian berhasil disimpan!');
                await fetchLaporanFromSupabase();
                state.view = 'riwayat';
                render();
            } catch (err) {
                console.error(err);
                showNotification('Gagal menyimpan laporan ke database.', 'error');
            }
        }

        async function fetchLaporanFromSupabase() {
            if (!supabaseClient || !state.user) return;
            try {
                const { data, error } = await supabaseClient
                    .from('laporan_harian')
                    .select('*')
                    .eq('pegawai_id', state.user.id);
                
                if (!error && data) {
                    state.laporanList = data;
                }
            } catch (err) {
                console.error("Gagal mengambil data laporan", err);
            }
        }

        function parseFotoUrls(foto_urls) {
            if (!foto_urls) return [];
            try {
                if (typeof foto_urls === 'string' && foto_urls.startsWith('[')) {
                    return JSON.parse(foto_urls);
                }
                return [foto_urls];
            } catch (e) {
                return [foto_urls];
            }
        }

        function renderRiwayatView() {
            const div = document.createElement('div');
            div.className = 'space-y-4';
            div.innerHTML = `
                <div class="flex items-center justify-between mb-2">
                    <h3 class="font-bold text-slate-800 text-lg">Riwayat Laporan & Unduh Foto JPG</h3>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${state.laporanList.length === 0 ? '<p class="text-sm text-slate-500">Belum ada riwayat laporan.</p>' :
                        state.laporanList.map(l => {
                            let urls = parseFotoUrls(l.foto_urls);
                            return `
                            <div class="glass-card p-4 rounded-2xl shadow-sm flex flex-col justify-between">
                                <div>
                                    <div class="flex items-center justify-between mb-2">
                                        <span class="text-xs font-semibold px-2.5 py-1 bg-red-50 text-red-600 rounded-lg">${l.tanggal}</span>
                                        <span class="text-xs font-semibold px-2.5 py-1 bg-emerald-50 text-emerald-700 rounded-lg">${l.status}</span>
                                    </div>
                                    ${l.rhk ? `<p class="text-xs font-bold text-red-700 mb-1">RHK: ${l.rhk}</p>` : ''}
                                    ${l.rencana_aksi ? `<p class="text-xs font-semibold text-slate-700 mb-1">Aksi: ${l.rencana_aksi}</p>` : ''}
                                    <p class="font-medium text-slate-800 text-sm mb-1">${l.uraian_kegiatan}</p>
                                    <p class="text-xs text-slate-500 mb-3">📍 ${l.lokasi} • Volume: ${l.volume}</p>
                                </div>
                                <div>
                                    ${urls.length > 0 ? `
                                        <div class="grid grid-cols-2 gap-2 mb-3">
                                            ${urls.map((url, idx) => `
                                                <div class="relative group">
                                                    <img src="${url}" class="w-full h-28 object-cover rounded-xl border border-slate-100">
                                                    <a href="${url}" download="Dokumentasi_${l.tanggal}_${idx + 1}.jpg" class="absolute bottom-1 right-1 bg-slate-900/80 hover:bg-slate-900 text-white p-1.5 rounded-lg text-xs flex items-center gap-1 backdrop-blur-sm transition">
                                                        <i data-lucide="download" class="w-3.5 h-3.5"></i> JPG ${idx + 1}
                                                    </a>
                                                </div>
                                            `).join('')}
                                        </div>
                                    ` : '<p class="text-xs text-slate-400 italic mb-3">Tidak ada foto dokumentasi</p>'}
                                </div>
                            </div>
                        `;}).join('')}
                </div>
            `;
            return div;
        }

        function renderProfilView() {
            const div = document.createElement('div');
            div.className = 'glass-card p-6 rounded-2xl shadow-sm max-w-xl mx-auto';
            div.innerHTML = `
                <div class="text-center mb-6">
                    <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full mx-auto flex items-center justify-center text-2xl font-bold mb-3">
                        ${state.user.nama.charAt(0)}
                    </div>
                    <h3 class="font-bold text-slate-900 text-lg">${state.user.nama}</h3>
                    <p class="text-xs text-slate-500">NIP: ${state.user.nip}</p>
                </div>
                <div class="space-y-3 text-sm border-t border-slate-100 pt-4">
                    <div class="flex justify-between py-2 border-b border-slate-50">
                        <span class="text-slate-500">Jabatan</span>
                        <span class="font-semibold text-slate-800">${state.user.jabatan}</span>
                    </div>
                    <div class="flex justify-between py-2 border-b border-slate-50">
                        <span class="text-slate-500">Unit Kerja</span>
                        <span class="font-semibold text-slate-800">${state.user.unit_kerja}</span>
                    </div>
                    <div class="flex justify-between py-2">
                        <span class="text-slate-500">Instansi</span>
                        <span class="font-semibold text-slate-800">Kementerian Sosial RI</span>
                    </div>
                </div>
            `;
            return div;
        }

        function logout() {
            state.user = null;
            state.laporanList = [];
            state.view = 'login';
            showNotification('Berhasil keluar akun.');
            render();
        }

        render();
    </script>
</body>
</html>
